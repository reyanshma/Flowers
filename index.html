```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you ghochu</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #fff7f2;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

.container {
  min-height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* BOUQUET */

.bouquet {
  position: relative;
  width: 420px;
  height: 420px;
  flex-shrink: 0;

  animation: pickUp 2.2s ease-in-out forwards;
  transform-origin: 50% 80%;
}

/* Starts sideways, then gently gets lifted upright */

@keyframes pickUp {
  0% {
    transform: rotate(75deg) translateX(0);
  }

  35% {
    transform: rotate(75deg) translateX(0);
  }

  70% {
    transform: rotate(0deg) translateX(0);
  }

  82% {
    transform: rotate(-3deg);
  }

  92% {
    transform: rotate(1.5deg);
  }

  100% {
    transform: rotate(0deg);
  }
}

/* STEMS */

.stem {
  position: absolute;
  width: 7px;
  height: 240px;
  background: #66805b;
  bottom: 55px;
  left: 50%;
  transform-origin: bottom center;
  border-radius: 5px;
}

.stem1 {
  transform: translateX(-50%) rotate(-20deg);
}

.stem2 {
  transform: translateX(-50%) rotate(-10deg);
}

.stem3 {
  transform: translateX(-50%) rotate(0deg);
}

.stem4 {
  transform: translateX(-50%) rotate(10deg);
}

.stem5 {
  transform: translateX(-50%) rotate(20deg);
}

/* LEAVES */

.leaf {
  position: absolute;
  width: 45px;
  height: 22px;
  background: #75956a;
  border-radius: 100% 0 100% 0;
}

.leaf1 {
  left: 115px;
  bottom: 145px;
  transform: rotate(-25deg);
}

.leaf2 {
  left: 145px;
  bottom: 105px;
  transform: rotate(15deg);
}

.leaf3 {
  right: 115px;
  bottom: 145px;
  transform: scaleX(-1) rotate(-25deg);
}

.leaf4 {
  right: 145px;
  bottom: 105px;
  transform: scaleX(-1) rotate(15deg);
}

/* FLOWERS */

.flower {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
}

.petal {
  position: absolute;
  width: 42px;
  height: 55px;
  background: #e9949e;
  border-radius: 50%;
  left: 24px;
  top: 17px;
  transform-origin: 50% 100%;
}

.petal:nth-child(1) {
  transform: rotate(0deg) translateY(-25px);
}

.petal:nth-child(2) {
  transform: rotate(72deg) translateY(-25px);
}

.petal:nth-child(3) {
  transform: rotate(144deg) translateY(-25px);
}

.petal:nth-child(4) {
  transform: rotate(216deg) translateY(-25px);
}

.petal:nth-child(5) {
  transform: rotate(288deg) translateY(-25px);
}

.center {
  position: absolute;
  width: 30px;
  height: 30px;
  background: #e6b35a;
  border-radius: 50%;
  left: 30px;
  top: 30px;
  z-index: 2;
}

/* FLOWER POSITIONS */

.flower1 {
  left: 165px;
  top: 40px;
}

.flower2 {
  left: 75px;
  top: 90px;
  transform: scale(.9);
}

.flower3 {
  right: 75px;
  top: 90px;
  transform: scale(.9);
}

.flower4 {
  left: 115px;
  top: 155px;
  transform: scale(.82);
}

.flower5 {
  right: 115px;
  top: 155px;
  transform: scale(.82);
}

/* WRAP */

.wrap {
  position: absolute;
  width: 220px;
  height: 145px;
  background: #d8b7a0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  clip-path: polygon(8% 0, 92% 0, 70% 100%, 30% 100%);
  z-index: 5;
}

/* RIBBON */

.ribbon {
  position: absolute;
  width: 80px;
  height: 28px;
  background: #b66b73;
  bottom: 55px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  border-radius: 5px;
}

.ribbon::before,
.ribbon::after {
  content: "";
  position: absolute;
  width: 55px;
  height: 35px;
  background: #b66b73;
  top: -5px;
  border-radius: 50%;
}

.ribbon::before {
  right: 65px;
  transform: rotate(25deg);
}

.ribbon::after {
  left: 65px;
  transform: rotate(-25deg);
}

/* MESSAGE */

.message {
  margin-top: -5px;
  font-size: 34px;
  color: #704646;

  opacity: 0;
  animation: messageAppear .8s ease 1.9s forwards;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* PHONE */

@media (max-width: 600px) {

  .container {
    min-height: 100svh;
    padding: 0 5px;
    overflow: hidden;
  }

  .bouquet {
    width: 320px;
    height: 360px;
    max-width: 90vw;
  }

  .wrap {
    width: 185px;
    height: 125px;
  }

  .ribbon {
    bottom: 48px;
  }

  .message {
    font-size: 28px;
    margin-top: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="bouquet">

    <!-- STEMS -->
    <div class="stem stem1"></div>
    <div class="stem stem2"></div>
    <div class="stem stem3"></div>
    <div class="stem stem4"></div>
    <div class="stem stem5"></div>

    <!-- LEAVES -->
    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>
    <div class="leaf leaf4"></div>

    <!-- FLOWER 1 -->
    <div class="flower flower1">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- FLOWER 2 -->
    <div class="flower flower2">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- FLOWER 3 -->
    <div class="flower flower3">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- FLOWER 4 -->
    <div class="flower flower4">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- FLOWER 5 -->
    <div class="flower flower5">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- WRAPPING -->
    <div class="wrap"></div>

    <!-- RIBBON -->
    <div class="ribbon"></div>

  </div>

  <div class="message">for you ghochu</div>

</div>

</body>
</html>
