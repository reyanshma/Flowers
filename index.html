<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For you ghochu</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #fff8f5;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    font-family: Georgia, serif;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
}


/* =========================
   BOUQUET
========================= */

.bouquet {
    position: relative;

    width: 100%;
    height: 420px;

    animation: pickUp 2.2s ease-in-out forwards;

    transform-origin: 50% 80%;
}


/* Bouquet starts sideways,
   then gets gently picked upright */

@keyframes pickUp {

    0% {
        transform: rotate(75deg) translateX(30px);
    }

    35% {
        transform: rotate(75deg) translateX(30px);
    }

    70% {
        transform: rotate(0deg) translateX(0);
    }

    82% {
        transform: rotate(-3deg);
    }

    92% {
        transform: rotate(1.5deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =========================
   STEMS
========================= */

.stem {
    position: absolute;

    width: 6px;
    height: 270px;

    background: #66875e;

    bottom: 45px;
    left: 50%;

    border-radius: 10px;

    transform-origin: bottom;
}

.stem1 {
    transform: translateX(-50%) rotate(-25deg);
}

.stem2 {
    transform: translateX(-50%) rotate(-12deg);
}

.stem3 {
    transform: translateX(-50%) rotate(0deg);
}

.stem4 {
    transform: translateX(-50%) rotate(12deg);
}

.stem5 {
    transform: translateX(-50%) rotate(25deg);
}


/* =========================
   LEAVES
========================= */

.leaf {
    position: absolute;

    width: 48px;
    height: 24px;

    background: #78976c;

    border-radius: 100% 0 100% 0;
}

.leaf1 {
    left: 18%;
    bottom: 125px;
    transform: rotate(25deg);
}

.leaf2 {
    left: 30%;
    bottom: 85px;
    transform: rotate(-25deg);
}

.leaf3 {
    right: 18%;
    bottom: 125px;
    transform: scaleX(-1) rotate(25deg);
}

.leaf4 {
    right: 30%;
    bottom: 85px;
    transform: scaleX(-1) rotate(-25deg);
}


/* =========================
   FLOWERS
========================= */

.flower {
    position: absolute;

    width: 115px;
    height: 115px;

    z-index: 5;
}


/* Positions */

.flower1 {
    left: 3%;
    top: 55px;
    transform: rotate(-10deg);
}

.flower2 {
    left: 23%;
    top: 20px;
    transform: rotate(-5deg);
}

.flower3 {
    left: 50%;
    top: 5px;

    transform:
        translateX(-50%)
        scale(1.1);
}

.flower4 {
    right: 23%;
    top: 20px;
    transform: rotate(5deg);
}

.flower5 {
    right: 3%;
    top: 55px;
    transform: rotate(10deg);
}


/* =========================
   PETALS
========================= */

.petal {
    position: absolute;

    width: 52px;
    height: 68px;

    left: 31px;
    top: 18px;

    border-radius: 50%;

    transform-origin: 50% 100%;
}

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-24px);
}

.petal:nth-child(2) {
    transform: rotate(72deg) translateY(-24px);
}

.petal:nth-child(3) {
    transform: rotate(144deg) translateY(-24px);
}

.petal:nth-child(4) {
    transform: rotate(216deg) translateY(-24px);
}

.petal:nth-child(5) {
    transform: rotate(288deg) translateY(-24px);
}


/* Flower colours */

.pink .petal {
    background: #e39aaa;
}

.red .petal {
    background: #d87878;
}

.yellow .petal {
    background: #f0d394;
}


/* Centres */

.center {
    position: absolute;

    width: 30px;
    height: 30px;

    left: 42px;
    top: 42px;

    border-radius: 50%;

    background: #c88a43;

    z-index: 10;
}


/* =========================
   RIBBON
========================= */

.ribbon {
    position: absolute;

    bottom: 28px;
    left: 50%;

    width: 115px;
    height: 75px;

    transform: translateX(-50%);

    z-index: 10;
}

.ribbon-left,
.ribbon-right {
    position: absolute;

    width: 38px;
    height: 27px;

    background: #b75f68;

    top: 5px;

    border-radius: 50%;
}

.ribbon-left {
    left: 18px;
    transform: rotate(-25deg);
}

.ribbon-right {
    right: 18px;
    transform: rotate(25deg);
}

.ribbon-center {
    position: absolute;

    width: 27px;
    height: 30px;

    background: #a94f59;

    left: 44px;
    top: 7px;

    border-radius: 7px;
}

.tail-left,
.tail-right {
    position: absolute;

    width: 29px;
    height: 48px;

    background: #b75f68;

    top: 28px;
}

.tail-left {
    left: 30px;
    transform: rotate(10deg);
}

.tail-right {
    right: 30px;
    transform: rotate(-10deg);
}


/* =========================
   MESSAGE
========================= */

.message {
    margin-top: -5px;

    font-size: 34px;

    color: #704646;

    opacity: 0;

    animation:
        messageAppear
        0.8s ease
        1.9s
        forwards;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   PHONE
========================= */

@media (max-width: 450px) {

    .bouquet {
        height: 360px;
    }

    .flower {
        width: 88px;
        height: 88px;
    }

    .petal {
        width: 40px;
        height: 53px;

        left: 24px;
        top: 14px;
    }

    .center {
        width: 24px;
        height: 24px;

        left: 32px;
        top: 32px;
    }

    .flower1 {
        left: 0;
    }

    .flower2 {
        left: 19%;
    }

    .flower4 {
        right: 19%;
    }

    .flower5 {
        right: 0;
    }

    .message {
        font-size: 28px;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="bouquet">

        <!-- Stems -->
        <div class="stem stem1"></div>
        <div class="stem stem2"></div>
        <div class="stem stem3"></div>
        <div class="stem stem4"></div>
        <div class="stem stem5"></div>


        <!-- Leaves -->
        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>


        <!-- Flower 1 -->
        <div class="flower red flower1">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>


        <!-- Flower 2 -->
        <div class="flower pink flower2">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>


        <!-- Center Flower -->
        <div class="flower yellow flower3">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>


        <!-- Flower 4 -->
        <div class="flower pink flower4">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>


        <!-- Flower 5 -->
        <div class="flower red flower5">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>


        <!-- Ribbon -->
        <div class="ribbon">

            <div class="ribbon-left"></div>
            <div class="ribbon-right"></div>

            <div class="ribbon-center"></div>

            <div class="tail-left"></div>
            <div class="tail-right"></div>

        </div>

    </div>


    <div class="message">
        for you ghochu
    </div>

</div>

</body>
</html>
